name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Smoke-test construction geometry
        run: npm run test:smoke
      - name: Build standalone HTML
        run: npm run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Construction3DBuilder-HTML
          path: dist/Construction3DBuilder.html
          if-no-files-found: error
      - name: Publish bundled app for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp dist/Construction3DBuilder.html Construction3DBuilder.html
          git add Construction3DBuilder.html
          if git diff --cached --quiet; then
            echo "Bundled app is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bundled Construction 3D Builder [skip ci]"
          git push
