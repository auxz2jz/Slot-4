name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Smoke-test construction geometry
        run: npm run test:smoke
      - name: Build standalone HTML
        run: npm run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Construction3DBuilder-HTML
          path: dist/Construction3DBuilder.html
          if-no-files-found: error
