name: Android bootstrap check

on:
  push:
    branches: [android-native-bootstrap]
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-bootstrap.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android 17 compile platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools' --channel=3
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run model and construction tests
        run: gradle -p android :core-model:test :construction:test --stacktrace
      - name: Assemble debug app
        run: gradle -p android :app:assembleDebug --stacktrace
